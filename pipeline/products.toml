# **Nitrate at fixed depths, R2's alone** (2026-10-10; the site's fetcher,
# LEVELS): the averages file's daily mean at the first 17 of Mercator's
# depths, one root a depth named for it to the meter.
[products.no3-cbefs]
title = "CBEFS nitrate at Mercator's depths"
step = "cbefs"
roots = ["no3-cbefs-0m.json", "no3-cbefs-2m.json", "no3-cbefs-3m.json", "no3-cbefs-4m.json",
         "no3-cbefs-5m.json", "no3-cbefs-6m.json", "no3-cbefs-8m.json", "no3-cbefs-10m.json",
         "no3-cbefs-11m.json", "no3-cbefs-13m.json", "no3-cbefs-16m.json", "no3-cbefs-18m.json",
         "no3-cbefs-22m.json", "no3-cbefs-25m.json", "no3-cbefs-29m.json", "no3-cbefs-34m.json",
         "no3-cbefs-40m.json"]
writes = ["no3-cbefs-*m.json"]
max_age_hours = 30
r2_only = true
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=no3-cbefs"]

