# What this repository publishes: CBEFS biogeochemistry — dissolved oxygen, pH, total alkalinity and aragonite saturation, at the surface and the bottom, from VIMS's Chesapeake Bay
# Environmental Forecast System (CBEFS), read by OPeNDAP from tds.vims.edu —
# published, not drawn on the website's map (the owner, 2026-09-27). Cite
# CBEFS and the Virginia Institute of Marine Science wherever it is shown:
# the data's license asks exactly that, and every header's `source` says it.
#
# The fetcher is the site's `scripts/fetch-cbefs.py`, shared by the three
# CBEFS repositories: this step is scoped with `--only=` to this repository's
# products, or the write fence refuses the run.
#
# - **Every `roots` entry must be one the site's `test-schema.mjs --roots`
#   publishes**, or the orchestrator exits 2.
# - **Paths are relative to the site checkout**: `scripts/...`.
# - **One regional grid per root at 0.007 degree**, `regional: true`, no
#   tiles; about 0.8 MB a field (1.4 MB for the currents), measured
#   2026-09-27. A bottom root's header carries no depth: the deepest level is
#   a different depth in every cell, and the root's name says bottom.
#
# **The budget.** Each run publishes the daily mean stamped noon UTC on
# today's date, so the frame is at most twelve hours from the reader, plus
# the six hours to the next run and GitHub's lateness. 20 hours; re-measure
# after a week. The run posted about 12:20 UTC covers the day before its date
# and four after, so when VIMS stops posting the frames carry on for days —
# `modelRun` in each header is what says how old the forecast is.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

# Named after the server all three CBEFS repositories read.
[steps.cbefs]
cmd = ["python3", "scripts/fetch-cbefs.py", "--only=o2-cbefs,o2-cbefs-bottom,ph-cbefs,ph-cbefs-bottom,talk-cbefs,talk-cbefs-bottom,omega-cbefs,omega-cbefs-bottom"]
lane = "vims-thredds"

[products.o2-cbefs]
title = "CBEFS surface dissolved oxygen"
step = "cbefs"
roots = ["o2-cbefs.json"]
writes = ["o2-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=o2-cbefs"]

[products.o2-cbefs-bottom]
title = "CBEFS bottom dissolved oxygen"
step = "cbefs"
roots = ["o2-cbefs-bottom.json"]
writes = ["o2-cbefs-bottom.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=o2-cbefs-bottom"]

[products.ph-cbefs]
title = "CBEFS surface pH"
step = "cbefs"
roots = ["ph-cbefs.json"]
writes = ["ph-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=ph-cbefs"]

[products.ph-cbefs-bottom]
title = "CBEFS bottom pH"
step = "cbefs"
roots = ["ph-cbefs-bottom.json"]
writes = ["ph-cbefs-bottom.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=ph-cbefs-bottom"]

[products.talk-cbefs]
title = "CBEFS surface total alkalinity"
step = "cbefs"
roots = ["talk-cbefs.json"]
writes = ["talk-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=talk-cbefs"]

[products.talk-cbefs-bottom]
title = "CBEFS bottom total alkalinity"
step = "cbefs"
roots = ["talk-cbefs-bottom.json"]
writes = ["talk-cbefs-bottom.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=talk-cbefs-bottom"]

[products.omega-cbefs]
title = "CBEFS surface aragonite saturation"
step = "cbefs"
roots = ["omega-cbefs.json"]
writes = ["omega-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=omega-cbefs"]

[products.omega-cbefs-bottom]
title = "CBEFS bottom aragonite saturation"
step = "cbefs"
roots = ["omega-cbefs-bottom.json"]
writes = ["omega-cbefs-bottom.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=omega-cbefs-bottom"]
